<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ready Timer">
<meta name="theme-color" content="#0e1116">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Ready Timer</title>
<style>
  :root{
    --bg:#0e1116; --card:#171c24; --card2:#1e2530; --line:#2a3342;
    --text:#e8edf4; --dim:#93a0b4; --cyan:#4cc9f0; --green:#2dd4a7;
    --amber:#ffb703; --red:#ff5d5d; --purple:#b388ff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    min-height:100%;}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    user-select:none; -webkit-user-select:none;}
  input{user-select:auto; -webkit-user-select:auto; font-family:inherit;}
  button{touch-action:manipulation; -webkit-user-select:none; user-select:none;}
  #app{max-width:720px;margin:0 auto;padding:12px 14px 40px;}
  h1{font-size:26px;margin:8px 0 2px;letter-spacing:.3px;}
  .sub{color:var(--dim);font-size:14px;margin:0 0 14px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;}
  label{display:block;color:var(--dim);font-size:13px;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.8px;}
  input[type=time],input[type=text],input[type=number]{
    width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);
    border-radius:12px;padding:12px 14px;font-size:20px;outline:none;}
  #goalTime{font-size:40px;padding:8px 12px;}
  input:focus{border-color:var(--cyan);}
  input.err{border-color:var(--red);}
  .row{display:flex;gap:10px;align-items:flex-end;}
  .row>*{flex:1;}
  .act{display:flex;gap:8px;align-items:center;background:var(--card2);
    border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;}
  .act .nm{flex:1;min-width:0;}
  .act input{font-size:17px;padding:9px 10px;}
  .duwrap{flex:0 0 84px;display:flex;flex-direction:column;gap:2px;}
  .duwrap .unit{color:var(--dim);font-size:11px;text-align:center;letter-spacing:1px;text-transform:uppercase;}
  .drag{color:var(--dim);font-size:20px;cursor:grab;user-select:none;-webkit-user-select:none;
    touch-action:none;padding:0 6px 0 2px;}
  .act.dragging{opacity:.9;border-color:var(--cyan);box-shadow:0 6px 18px rgba(0,0,0,.5);}
  .del{background:none;border:none;color:var(--red);font-size:22px;cursor:pointer;padding:4px 6px;}
  button.b{background:var(--card2);border:1px solid var(--line);color:var(--text);
    border-radius:12px;padding:12px 16px;font-size:17px;cursor:pointer;}
  button.b:active{filter:brightness(1.25);}
  button.primary{background:var(--green);border-color:var(--green);color:#04231a;font-weight:700;}
  button.demo{background:var(--purple);border-color:var(--purple);color:#180a33;font-weight:700;}
  .big-btn{width:100%;font-size:22px;padding:16px;margin-top:6px;}
  table.tl{width:100%;border-collapse:collapse;font-size:16px;}
  table.tl td,table.tl th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;}
  table.tl th{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.8px;}
  table.tl tr.cur{background:rgba(76,201,240,.12);}
  table.tl tr.cur td:first-child{border-left:3px solid var(--cyan);}
  table.tl tr.done{color:var(--dim);}
  table.tl tr.done td:first-child{text-decoration:line-through;}
  table.tl tr.past td{color:var(--red);}
  .times{white-space:nowrap;font-variant-numeric:tabular-nums;}
  .msg{color:var(--red);font-size:14px;min-height:18px;margin-top:8px;}
  .note{color:var(--dim);font-size:13px;line-height:1.5;}
  .toggle{display:flex;align-items:center;gap:10px;margin-top:12px;color:var(--text);font-size:16px;}
  .switch{position:relative;width:52px;height:30px;flex:none;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;inset:0;background:#3a4454;border-radius:30px;cursor:pointer;transition:.2s;}
  .slider:before{content:"";position:absolute;height:24px;width:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
  .switch input:checked + .slider{background:var(--green);}
  .switch input:checked + .slider:before{transform:translateX(22px);}

  /* ===== RUN VIEW ===== */
  #run .goalline{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;}
  #run .goal-big{font-size:clamp(26px,6.5vmin,40px);font-weight:800;letter-spacing:.5px;}
  #run .goal-in{font-size:clamp(18px,4.5vmin,28px);color:var(--cyan);font-weight:700;font-variant-numeric:tabular-nums;}
  #run .goal-sub{color:var(--dim);font-size:15px;min-height:20px;}
  #run .act-name{font-size:clamp(30px,8vmin,54px);font-weight:800;margin:14px 0 4px;line-height:1.1;min-height:1.1em;color:#ff8fd8;}
  #run .remain{font-size:clamp(28px,8.5vmin,60px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1;
    color:var(--text);margin:4px 0 2px;white-space:nowrap;}
  #run .remain.warn{color:var(--amber);}
  #run .remain.late{color:var(--red);}
  #run .pct{font-size:clamp(20px,5vmin,32px);color:var(--dim);font-weight:700;min-height:1.2em;}
  .bar{position:relative;height:48px;background:#232b38;border-radius:12px;margin:10px 0 2px;overflow:hidden;}
  .bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--cyan);border-radius:12px;transition:width .3s linear;}
  .bar .tick{position:absolute;top:0;bottom:0;width:3px;background:rgba(255,255,255,.35);}
  .bar-times{display:flex;justify-content:space-between;font-size:18.75px;color:var(--dim);
    font-variant-numeric:tabular-nums;padding:0 2px 4px;}
  .ctl{display:flex;gap:6px;margin:14px 0 6px;}
  .ctl button{border:none;border-radius:14px;padding:16px 2px;font-size:17px;font-weight:800;cursor:pointer;line-height:1.15;min-width:0;}
  .ctl .done{flex:1.35;background:var(--green);color:#04231a;}
  .ctl .pause{flex:1.1;background:#2c3646;color:var(--text);}
  .ctl .pause.resuming{background:var(--amber);color:#332300;}
  .ctl .warn5{flex:.9;background:#232b38;color:var(--dim);font-size:14px;font-weight:700;}
  .late5{background:#232b38;color:var(--dim);font-size:15px;font-weight:600;}
  .banner{border-radius:12px;padding:10px 14px;font-size:16px;font-weight:600;margin:10px 0;display:none;}
  .banner.behind{display:block;background:rgba(255,183,3,.15);color:var(--amber);border:1px solid rgba(255,183,3,.4);}
  .banner.ahead{display:block;background:rgba(45,212,167,.12);color:var(--green);border:1px solid rgba(45,212,167,.4);}
  .banner.paused{display:block;background:rgba(179,136,255,.14);color:var(--purple);border:1px solid rgba(179,136,255,.4);}
  #tlwrap{max-height:31vh;overflow-y:auto;margin-top:8px;}
  #flashbg{position:fixed;inset:0;pointer-events:none;display:none;z-index:40;}
  body.flashing #flashbg{display:block;animation:flashbg .45s steps(1) 4;}
  @keyframes flashbg{0%{background:rgba(255,255,255,.92)}50%{background:transparent}}
  #alertOv{position:fixed;inset:0;background:rgba(10,12,16,.94);display:none;z-index:50;cursor:pointer;
    flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;}
  #alertOv.show{display:flex;}
  #alertOv .a-kind{color:var(--dim);font-size:clamp(16px,4vmin,24px);text-transform:uppercase;letter-spacing:2px;}
  #alertOv .a-big{font-size:clamp(34px,10vmin,72px);font-weight:900;margin:10px 0;line-height:1.1;}
  #alertOv .a-sub{font-size:clamp(18px,5vmin,30px);color:var(--cyan);font-weight:700;font-variant-numeric:tabular-nums;}
  #alertOv.milestone .a-big{color:var(--amber);}
  #alertOv.start .a-big{color:var(--cyan);}
  #alertOv.danger .a-big{color:var(--red);}
  #alertOv.good .a-big{color:var(--green);}
  #doneView{text-align:center;padding-top:8vh;}
  #doneView .emoji{font-size:clamp(60px,16vmin,120px);}
  #doneView .big{font-size:clamp(34px,9vmin,60px);font-weight:900;margin:8px 0;}
  #doneView .stat{font-size:clamp(20px,5.5vmin,32px);color:var(--dim);margin:6px 0;font-variant-numeric:tabular-nums;}
  a{color:var(--cyan);}
</style>
</head>
<body>
<div id="flashbg"></div>
<div id="app"></div>
<div id="alertOv"><div class="a-kind"></div><div class="a-big"></div><div class="a-sub"></div></div>

<script>
'use strict';
/* ================= Ready Timer =================
   Backwards-planned routine timer for ADHD time blindness.
   All scheduling uses absolute wall-clock epochs (ms), so pausing,
   finishing early, editing, and screen sleep stay consistent:
   the timeline is always "what will actually happen from now". */

const LS_KEY = 'readyTimer.v1';
const APP_VER = 'v1.5';
const $ = s => document.querySelector(s);

const DEFAULT_ACTS = [
  {id:'a1', name:'Wake up & out of bed',    dur:10},
  {id:'a2', name:'Shower',                  dur:15},
  {id:'a3', name:'Get dressed',             dur:10},
  {id:'a4', name:'Breakfast',               dur:20},
  {id:'a5', name:'Makeup',                  dur:15},
  {id:'a6', name:'Shoes, bag, keys, phone', dur:5},
];

let state = load();
let wakeLock = null;
let audioCtx = null;

function freshState(){
  return {
    view:'plan', mode:'live', goalHHMM:'08:30',
    planned: DEFAULT_ACTS.map(a=>({...a})),
    running:false, segs:[], done:[], cur:0,
    voiceName:null,
    goalEpoch:null, origGoalEpoch:null,
    paused:false, pausedAt:null, pausedFor:0, frozenRem:0, pausedPct:0,
    fired:{}, voice:false, allDoneAt:null, lastDoneTap:0, lastPauseTap:0,
  };
}
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(LS_KEY));
    if(s && s.planned && Array.isArray(s.planned)) return Object.assign(freshState(), s);
  }catch(e){}
  return freshState();
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function reset(){ state = freshState(); save(); render(); }

/* ---------- time helpers ---------- */
function nowMs(){ return Date.now(); }
function epochOf(hhmm){
  const [h,m] = hhmm.split(':').map(Number);
  const d = new Date(); d.setHours(h,m,0,0);
  let t = d.getTime();
  if(t < Date.now() - 2*3600000) t += 86400000; // >2h past => interpret as tomorrow
  return t;
}
function goalDayLabel(){
  const [h,m] = state.goalHHMM.split(':').map(Number);
  const d = new Date(); d.setHours(h,m,0,0);
  const raw = d.getTime();
  if(raw < Date.now() - 2*3600000) return '(tomorrow)';
  if(raw < Date.now()) return '(today — running late?)';
  return '(today)';
}
function fmtClock(ms){
  const d = new Date(ms);
  const o = state && state.mode==='demo' ? {hour:'numeric',minute:'2-digit',second:'2-digit'}
                                          : {hour:'numeric',minute:'2-digit'};
  return d.toLocaleTimeString([], o);
}
function fmtMins(ms){
  const m = Math.max(0, ms) / 60000;
  return (Math.round(m*10)/10).toFixed(1);
}
function fmtDur(ms){
  return fmtMins(ms) + ' min';
}
function fmtSpeech(ms){
  const s = Math.max(0, Math.round(ms/1000));
  if(s >= 90){ const m = Math.round(s/60); return m + ' minute' + (m===1?'':'s'); }
  return s + ' second' + (s===1?'':'s');
}
function fmtMins(ms){
  const m = Math.max(0, ms) / 60000;
  return (Math.round(m*10)/10).toFixed(1);
}
function fmtDurWords(ms){
  ms = Math.max(0, ms);
  const s = Math.round(ms/1000);
  if(s >= 5400){
    const h = Math.floor(s/3600), m = Math.round((s%3600)/60);
    return h + ' hr' + (h===1?'':'s') + ' ' + m + ' min' + (m===1?'':'s');
  }
  const m = Math.floor(s/60), r = s%60;
  if(m === 0) return s + ' sec' + (s===1?'':'s');
  return m + ' min' + (m===1?'':'s') + ' & ' + r + ' sec' + (r===1?'':'s');
}

/* ---------- schedule math ---------- */
function scale(){ return state.mode==='demo' ? 1/20 : 1; } // demo: 1 min -> 3 s

// fill segs from index i0: current activity starts at anchor, rest follow
function rebuildForward(i0, anchor){
  const sc = scale();
  for(let i=i0; i<state.planned.length; i++){
    const p = state.planned[i];
    const dur = p.dur*60000*sc;
    const start = (i === i0) ? anchor : state.segs[i-1].end;
    state.segs[i] = {id:p.id, name:p.name, start, end: start + dur};
  }
  state.goalEpoch = state.segs[state.segs.length-1].end;
}
function shiftFuture(shift){
  for(let i=state.cur; i<state.segs.length; i++){
    state.segs[i].start += shift; state.segs[i].end += shift;
  }
  state.goalEpoch += shift;
}

/* ---------- sound / speech / flash ---------- */
function beep(kind){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime;
    const seq = kind==='start'   ? [[660,0],[880,.18],[1100,.36]]
              : kind==='done'    ? [[880,0],[1174,.15]]
              : kind==='danger'  ? [[520,0],[520,.22],[520,.44]]
              :                    [[988,0],[988,.16]];
    seq.forEach(([f,dt])=>{
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001, t0+dt);
      g.gain.exponentialRampToValueAtTime(.5, t0+dt+.02);
      g.gain.exponentialRampToValueAtTime(.0001, t0+dt+.22);
      o.connect(g).connect(audioCtx.destination);
      o.start(t0+dt); o.stop(t0+dt+.25);
    });
  }catch(e){}
}
function voiceScore(v){
  let s = 0;
  if(/premium/i.test(v.name)) s += 4;
  else if(/enhanced|elite/i.test(v.name)) s += 3;
  if(/\(siri\)|siri/i.test(v.name)) s += 1;
  if(/eloquence|espeak|festival|compact/i.test(v.name)) s -= 2;
  return s;
}
function pickVoice(){
  if(!('speechSynthesis' in window)) return null;
  const vs = speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))
    .sort((a,b)=> voiceScore(b)-voiceScore(a) || a.name.localeCompare(b.name));
  if(state.voiceName){
    const hit = vs.find(v=>v.voiceURI===state.voiceName || v.name===state.voiceName);
    if(hit) return hit;
  }
  return vs[0] || null;
}
function populateVoiceSel(){
  const sel = $('#voiceSel'); if(!sel) return;
  if(!('speechSynthesis' in window)){
    sel.innerHTML = '<option>Speech not supported here</option>'; return;
  }
  const vs = speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))
    .sort((a,b)=> voiceScore(b)-voiceScore(a) || a.name.localeCompare(b.name));
  sel.innerHTML = vs.map(v=>{
    const tag = /premium/i.test(v.name) ? ' — premium ★' : /enhanced|elite/i.test(v.name) ? ' — enhanced ★' : '';
    return '<option value="' + esc(v.voiceURI) + '">' + esc(v.name.replace(/\s*\((premium|enhanced|elite)\)/i,'')) + tag + '</option>';
  }).join('') || '<option value="">No English voices found</option>';
  if(state.voiceName && vs.some(v=>v.voiceURI===state.voiceName)) sel.value = state.voiceName;
  else if(vs[0]){ sel.value = vs[0].voiceURI; }
}
function previewVoice(){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    setTimeout(()=>{
      try{
        const u = new SpeechSynthesisUtterance('Hey! Time to move on to the next thing.');
        const sel = $('#voiceSel');
        const v = sel && speechSynthesis.getVoices().find(x=>x.voiceURI===sel.value);
        if(v) u.voice = v;
        speechSynthesis.speak(u);
      }catch(e){}
    }, 60);
  }catch(e){}
}
function speak(text){
  if(!state.voice || !('speechSynthesis' in window) || !text) return;
  try{
    speechSynthesis.cancel();
    // small defer: Safari drops utterances spoken in the same tick as cancel()
    setTimeout(()=>{
      try{
        const u = new SpeechSynthesisUtterance(text);
        const v = pickVoice(); if(v) u.voice = v;
        u.rate = 1; u.pitch = 1; u.volume = 1;
        speechSynthesis.speak(u);
      }catch(e){}
    }, 60);
  }catch(e){}
}
function flashVisual(){
  document.body.classList.remove('flashing');
  void document.body.offsetWidth; // restart animation
  document.body.classList.add('flashing');
  setTimeout(()=>document.body.classList.remove('flashing'), 2200);
  try{ navigator.vibrate && navigator.vibrate([200,100,200,100,200]); }catch(e){}
}
let ovTimer = null;
function showAlert(kind, small, big, sub, speakText, ms){
  beep(kind);
  flashVisual();
  speak(speakText);
  const ov = $('#alertOv');
  ov.className = 'show ' + kind;
  ov.querySelector('.a-kind').textContent = small;
  ov.querySelector('.a-big').textContent = big;
  ov.querySelector('.a-sub').textContent = sub || '';
  clearTimeout(ovTimer);
  ovTimer = setTimeout(()=>ov.classList.remove('show'), ms||3500);
}
function dismissAlert(){ clearTimeout(ovTimer); $('#alertOv').classList.remove('show'); }
$('#alertOv').addEventListener('click', dismissAlert);

/* ---------- alerts ---------- */
function firedKey(i, kind){ return i + ':' + kind; }
function fireMilestone(i, kind){
  const seg = state.segs[i];
  const rem = seg.end - nowMs();
  if(kind==='p50'){
    showAlert('milestone','50% through','HALFWAY', seg.name,
      'Halfway through ' + seg.name + '.');
  }
  state.fired[firedKey(i,kind)] = true;
  save();
}
function fireStart(i, seg){
  state.fired[firedKey(i,'start')] = true;
  const p = state.planned[i];
  showAlert('start','Activity ' + (i+1) + ' of ' + state.planned.length,
    'NOW: ' + seg.name, fmtClock(seg.start) + ' → ' + fmtClock(seg.end),
    'Now: ' + seg.name + '. ' + fmtSpeech(seg.end - seg.start) + '.');
  save();
}

/* ---------- main tick ---------- */
function tick(){
  if(!state || !state.running) return;
  if(wakeLock && wakeLock.released && !document.hidden) keepAwake();
  if(wakeVideo && wakeVideo.paused && !document.hidden){ const p = wakeVideo.play(); if(p && p.catch) p.catch(()=>{}); }
  const t = nowMs();

  if(!state.paused){
    const seg = state.segs[state.cur];
    if(!state.fired[firedKey(state.cur,'start')]) fireStart(state.cur, seg);
    const over = t >= seg.end;
    if(over){
      // OVERTIME: stay on this activity until marked done; future + goal slip with now
      let ft = t;
      for(let j=state.cur+1; j<state.planned.length; j++){
        const p = state.planned[j];
        state.segs[j] = {id:p.id, name:p.name, start:ft, end: ft + p.dur*60000*scale()};
        ft = state.segs[j].end;
      }
      state.goalEpoch = state.cur < state.planned.length-1
        ? state.segs[state.planned.length-1].end : t;
      // nag: alert at 0 then every 30s until marked done
      const n = Math.floor((t - seg.end)/30000);
      if(!state.fired[firedKey(state.cur,'ot'+n)]){
        state.fired[firedKey(state.cur,'ot'+n)] = true;
        const mins = fmtDurWords(t - seg.end);
        if(n === 0)
          showAlert('danger','Time is up','WRAP UP: ' + seg.name,
            'Tap ✓ DONE when finished — finish time is slipping',
            'Time is up. Finish up and tap done.');
        else
          showAlert('danger','Still going…','+' + mins + ' OVER',
            'Tap ✓ DONE when finished', null, 2500);
        save();
      }
    }
    const pct = (t - seg.start)/(seg.end - seg.start);
    [['p50',.5]].forEach(([k,m])=>{
      if(!over && pct >= m && !state.fired[firedKey(state.cur,k)]) fireMilestone(state.cur, k);
    });
  }
  updateRunDOM();
}

/* ---------- actions ---------- */
function startRun(demo){
  state.mode = demo ? 'demo' : 'live';
  state.planned.forEach((p,i)=>{ if(!(p.dur>0)) p.dur = 1; if(!p.name.trim()) p.name = 'Activity ' + (i+1); });
  state.running = true; state.view = 'run';
  state.done = []; state.cur = 0; state.fired = {};
  state.paused = false; state.pausedAt = null; state.pausedFor = 0;
  state.frozenRem = 0; state.pausedPct = 0; state.allDoneAt = null; state.lastDoneTap = 0;
  state.origGoalEpoch = epochOf(state.goalHHMM);
  const sc = scale();
  const total = state.planned.reduce((a,p)=>a + p.dur*60000*sc, 0);
  let t0 = state.origGoalEpoch - total;
  const lateStart = t0 < nowMs() - 30000;
  const earlyStart = t0 > nowMs() + 30000;
  if(lateStart || earlyStart) t0 = nowMs();
  rebuildIdleScaled(t0);
  state.goalEpoch = state.segs[state.segs.length-1].end;
  save();
  keepAwake();
  startWakeVideo();
  buildRunDOM();
  updateRunDOM();
  fireStart(0, state.segs[0]);
  if(lateStart){
    const behind = state.goalEpoch - state.origGoalEpoch;
    speak('Starting late. Original goal ' + hmSpeak(state.origGoalEpoch) +
      '. On this pace you will finish at ' + hmSpeak(state.goalEpoch) +
      '. Finish activities early to catch up.');
    setTimeout(()=>showAlert('danger','Started late','RUNNING ' + fmtDur(behind) + ' BEHIND',
      'Finish activities early to catch up.', null, 6000), 3000);
  }else if(earlyStart){
    const buffer = state.origGoalEpoch - state.goalEpoch;
    if(buffer > 30000) speak('Starting early. ' + fmtSpeech(buffer) + ' of buffer before your goal.');
  }
}
function rebuildIdleScaled(t0){
  const sc = scale();
  let t = t0;
  state.segs = state.planned.map(p=>{
    const s = {id:p.id, name:p.name, start:t, end:t + p.dur*60000*sc};
    t = s.end; return s;
  });
}
function hmSpeak(ms){
  const d = new Date(ms); let h = d.getHours(); const m = d.getMinutes();
  const ap = h>=12 ? 'pm' : 'am'; h = h%12 || 12;
  return h + (m ? ' ' + m : '') + ' ' + ap;
}
function doneActivity(){
  if(!state.running) return;
  const t = nowMs();
  if(t - (state.lastDoneTap||0) < 400) return; // double-tap guard
  state.lastDoneTap = t;
  if(state.paused){ // finishing while paused: settle the pause first
    const shift = t - state.pausedAt;
    state.pausedFor += shift; shiftFuture(shift);
    state.paused = false; state.pausedAt = null;
  }
  state.done.push({i:state.cur, at:t});
  state.segs[state.cur].end = t;
  dismissAlert();
  if(state.cur >= state.planned.length-1){ finishAll(); return; }
  state.cur++;
  rebuildForward(state.cur, t);
  state.fired[firedKey(state.cur,'start')] = true;
  const nxt = state.segs[state.cur];
  showAlert('good','Done — next up','NEXT: ' + nxt.name,
    fmtClock(nxt.start) + ' → ' + fmtClock(nxt.end),
    'Done. Next: ' + nxt.name + '.');
  save(); updateRunDOM();
}
function pauseToggle(){
  if(!state.running) return;
  const t = nowMs();
  if(t - (state.lastPauseTap||0) < 300) return;
  state.lastPauseTap = t;
  if(!state.paused){
    state.paused = true;
    state.pausedAt = t;
    const seg = state.segs[state.cur];
    state.frozenRem = seg.end - t;
    state.pausedPct = Math.max(0, Math.min(1, (t - seg.start)/(seg.end - seg.start)));
    speak('Paused.');
  }else{
    const shift = nowMs() - state.pausedAt;
    state.pausedFor += shift;
    shiftFuture(shift);
    state.paused = false; state.pausedAt = null;
    speak('Back on. ' + fmtSpeech(state.segs[state.cur].end - nowMs()) +
      ' left on ' + state.segs[state.cur].name + '.');
  }
  save(); updateRunDOM();
}
function bumpGoal(min){
  const shift = min*60000*scale();
  shiftFuture(shift);
  if(state.paused) state.frozenRem += shift;
  save(); updateRunDOM();
}
function backOne(){
  if(state.cur<=0 || !state.running) return;
  if(state.paused){
    const shift = nowMs()-state.pausedAt;
    state.pausedFor += shift; shiftFuture(shift);
    state.paused = false; state.pausedAt = null;
  }
  state.cur--;
  state.done = state.done.filter(d=>d.i!==state.cur);
  rebuildForward(state.cur, nowMs());
  for(let i=state.cur;i<state.planned.length;i++){
    delete state.fired[firedKey(i,'start')];
    delete state.fired[firedKey(i,'p25')];
    delete state.fired[firedKey(i,'p50')];
    delete state.fired[firedKey(i,'p75')];
  }
  const seg = state.segs[state.cur];
  showAlert('good','Restarted','AGAIN: ' + seg.name,
    fmtClock(seg.start) + ' → ' + fmtClock(seg.end),
    'Restarting ' + seg.name + '.');
  save(); updateRunDOM();
}
function finishAll(){
  const lastIdx = state.planned.length-1;
  if(lastIdx>=0 && !state.done.some(d=>d.i===lastIdx)) state.done.push({i:lastIdx, at:nowMs()});
  stopWakeVideo();
  state.running = false; state.view = 'done'; state.allDoneAt = nowMs();
  dismissAlert();
  beep('done'); flashVisual();
  const diff = state.allDoneAt - state.origGoalEpoch;
  speak('All done. ' + (diff<=0
    ? 'You are out the door with ' + fmtSpeech(-diff) + ' to spare.'
    : 'You are ' + fmtSpeech(diff) + ' past your goal. Move fast!'));
  save(); render();
}

let wakeVideo = null;
async function keepAwake(){
  try{
    if(!('wakeLock' in navigator)) return;
    if(wakeLock && !wakeLock.released) return;
    wakeLock = await navigator.wakeLock.request('screen');
  }catch(e){}
}
function startWakeVideo(){
  if(wakeVideo) return;
  try{
    wakeVideo = document.createElement('video');
    wakeVideo.setAttribute('playsinline','');
    wakeVideo.setAttribute('loop','');
    wakeVideo.src = 'icons/keepawake.mp4';
    wakeVideo.muted = true;   // property, not attribute — else autoplay is rejected
    wakeVideo.loop = true;
    wakeVideo.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0.01;pointer-events:none;bottom:0;left:0;';
    document.body.appendChild(wakeVideo);
    const p = wakeVideo.play();
    if(p && p.catch) p.catch(()=>{});
  }catch(e){}
}
function stopWakeVideo(){
  if(!wakeVideo) return;
  try{ wakeVideo.pause(); wakeVideo.remove(); }catch(e){}
  wakeVideo = null;
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && state && state.running){
    keepAwake();
    tick(); // catch up immediately after returning
  }
});

/* --- drag reordering (mouse + touch via Pointer Events) --- */
function bindDrag(container){
  let dragI = null, rowH = 0, startY = 0, dy = 0, row = null, pid = null;
  container.addEventListener('pointerdown', e=>{
    const h = e.target.closest('.drag'); if(!h) return;
    row = h.closest('.act'); if(!row) return;
    e.preventDefault();
    pid = e.pointerId;
    dragI = +row.dataset.i;
    rowH = row.offsetHeight + 8; // 8px margin-bottom
    startY = e.clientY; dy = 0;
    row.classList.add('dragging');
    h.setPointerCapture(pid);
  });
  container.addEventListener('pointermove', e=>{
    if(dragI === null || e.pointerId !== pid) return;
    dy = e.clientY - startY;
    row.style.transform = 'translateY(' + dy + 'px)';
    const shift = Math.round(dy / rowH);
    const to = Math.max(0, Math.min(state.planned.length-1, dragI + shift));
    if(to !== dragI){
      const [m] = state.planned.splice(dragI,1);
      state.planned.splice(to,0,m);
      // move the DOM row to match, then renumber by DOM order
      if(to > dragI) container.insertBefore(row, container.children[to].nextSibling);
      else container.insertBefore(row, container.children[to]);
      [...container.querySelectorAll('.act')].forEach((r,idx)=>{ r.dataset.i = idx; });
      dragI = to;
      startY += shift*rowH; dy = 0;
      row.style.transform = 'translateY(0)';
    }
  });
  container.addEventListener('pointerup', e=>{
    if(dragI === null) return;
    row.style.transform = '';
    row.classList.remove('dragging');
    dragI = null;
    save(); updatePlanPreview();
  });
  container.addEventListener('pointercancel', ()=>{
    if(dragI === null) return;
    row.style.transform = '';
    row.classList.remove('dragging');
    dragI = null;
    save(); updatePlanPreview();
  });
}
function tryStart(demo){
  const bad = [];
  state.planned.forEach((p,i)=>{ if(!(p.dur>0)) bad.push(i); });
  if(!state.planned.length || bad.length || !state.goalHHMM){
    $('#planMsg').textContent = !state.goalHHMM ? 'Set a goal time first.'
      : 'Every activity needs a duration (minutes).';
    bad.forEach(i=>{
      const row = document.querySelector('#acts .act[data-i="'+i+'"] input.du');
      if(row) row.classList.add('err');
    });
    return;
  }
  if(!demo){
    const total = state.planned.reduce((a,p)=>a + p.dur*60000, 0);
    const t0 = epochOf(state.goalHHMM) - total;
    if(t0 > Date.now() + 2*3600000){
      $('#planMsg').textContent = 'Goal is more than 2 hours away — start the routine when you actually begin getting ready.';
      return;
    }
  }
  startRun(demo);
}
function updatePlanPreview(){

      + fmtMins(total) + ' min</b> &nbsp;→&nbsp; start at <b>' + fmtClock(start) + '</b></span>'
      + (start < nowMs() ? ' <span class="note" style="color:var(--red)">(already past — Start anchors to now)</span>' : '')
    : 'Add activities to build the plan.';

    $('#planSummary').closest('.card').after(tbl);

             '</td><td class="times">' + fmtClock(t) + '</td></tr>';
    }).join('');
  }
}

function updateRunDOM(){
  if(!runBuilt || !state.running) return;
  const t = nowMs();
  const seg = state.segs[state.cur];
  if(!seg) return;
  const last = state.planned.length-1;

  // goal line — original goal always visible
  $('#goalBig').textContent = 'GOAL ' + fmtClock(state.origGoalEpoch);
  const diff = state.goalEpoch - state.origGoalEpoch;
  $('#goalSub').textContent = Math.abs(diff) < 30000 ? 'on pace'
    : (diff>0 ? 'this pace: ' + fmtClock(state.goalEpoch) + ' (' + fmtDur(diff) + ' late)'
              : 'this pace: ' + fmtClock(state.goalEpoch) + ' (' + fmtDur(-diff) + ' early)');
  const gd = state.origGoalEpoch - t;
  $('#goalIn').textContent = state.paused ? '⏸ paused'
    : (gd>=0 ? fmtDur(gd) + ' to goal' : '+' + fmtDur(-gd) + ' past goal');

  // status banner
  const b = $('#statusBanner');
  if(state.paused){
    b.className = 'banner paused';
    b.textContent = '⏸ PAUSED — everything slides ' + fmtDur(state.pausedFor + (t-state.pausedAt)) +
      '. Original goal ' + fmtClock(state.origGoalEpoch) + ' stays the goal — finish something early to catch up.';
  }else if(diff > 30000){
    b.className = 'banner behind';
    b.textContent = '⚠ ' + fmtDur(diff) + ' behind original goal — finish an activity early to catch up.';
  }else if(diff < -30000){
    b.className = 'banner ahead';
    b.textContent = '✓ ' + fmtDur(-diff) + ' ahead of original goal.';
  }else b.className = 'banner';

  // current activity
  $('#actName').textContent = seg.name || '—';
  let rem, pct;
  if(state.paused){ rem = state.frozenRem; pct = state.pausedPct; }
  else { rem = seg.end - t; pct = (t-seg.start)/(seg.end-seg.start); }
  pct = Math.max(0, Math.min(1, pct));
  const warnMs = 60000*scale();
  const r = $('#remain');
  if(rem < 0){ r.textContent = '+' + fmtDurWords(-rem); r.className = 'remain late'; }
  else { r.textContent = fmtDurWords(rem); r.className = 'remain' + (rem < warnMs ? ' warn' : ''); }
  $('#fill').style.width = (pct*100).toFixed(1) + '%';
  $('#barStart').textContent = fmtClock(seg.start);
  $('#barMid').textContent = fmtClock(seg.start + Math.floor(seg.end-seg.start)/2);
  $('#barEnd').textContent = fmtClock(seg.end);

  // pause button label
  const pb = $('#pauseBtn');
  if(state.paused){ pb.textContent = '▶ RESUME'; pb.classList.add('resuming'); }
  else{ pb.textContent = '⏸ PAUSE'; pb.classList.remove('resuming'); }
  $('#pauseNote').textContent = state.paused
    ? 'Paused ' + fmtDur(t - state.pausedAt) + ' ago. Original goal kept: ' + fmtClock(state.origGoalEpoch) + '.' : '';

  // timeline — scroll so one completed row stays visible above the current one
  const tlw = $('#tlwrap');
  const tb = $('#tlBody');
  if(tlw && state.cur !== (updateRunDOM._scrolled ?? -1)){
    updateRunDOM._scrolled = state.cur;
    const target = Math.max(0, state.cur-1);
    const rowEl = tb.children[target];
    if(rowEl){
      const delta = rowEl.getBoundingClientRect().top - tlw.getBoundingClientRect().top;
      tlw.scrollTo({top: Math.max(0, tlw.scrollTop + delta), behavior:'smooth'});
    }
  }
  tb.innerHTML = state.planned.map((p,i)=>{
    const s = state.segs[i]; if(!s) return '';
    const isDone = state.done.some(d=>d.i===i) || (i<state.cur);
    const isCur = i===state.cur;
    const past = !isDone && !isCur && s.end < t;
    let st = isDone ? '✓ done' : isCur ? '▶ NOW' : past ? 'late' : '…';
    const cls = isDone ? 'done' : isCur ? 'cur' : past ? 'past' : '';
    return '<tr class="'+cls+'"><td>' + esc(p.name||'—') + '</td>' +
      '<td class="times">' + fmtClock(s.start) + '</td><td class="times">' + fmtClock(s.end) + '</td>' +
      '<td>' + st + '</td></tr>';
  }).join('');

  document.title = state.paused ? '⏸ Ready Timer'
    : fmtClock(seg.end) + ' · ' + (seg.name||'') + ' · Ready Timer';
}

function swBlocker(){
  if(!('serviceWorker' in navigator)) return 'This browser does not support offline installs.';
  if(!window.isSecureContext) return 'Offline install needs HTTPS (or localhost). Serve the app over HTTPS, or open it on the host machine as http://localhost — then re-do "Add to Home Screen".';
  return null;
}
if('serviceWorker' in navigator && window.isSecureContext){
  try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
}
if(!window.isSecureContext){
  document.title = '⚠ Ready Timer (no offline)';
}

/* ================= boot ================= */
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = ()=>{ populateVoiceSel(); };
}
window.addEventListener('beforeunload', ()=>{ save(); });
setInterval(tick, 200);
render();
</script>
</body>
